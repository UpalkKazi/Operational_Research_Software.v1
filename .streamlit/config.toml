[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#172235"
font = "sans-serif"
baseFontSize = 16
borderColor = "#D5DDE8"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
